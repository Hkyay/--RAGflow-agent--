[supervisord]
nodaemon=true
logfile=/home/user/supervisor/supervisord.log
pidfile=/home/user/supervisor/supervisord.pid
childlogdir=/home/user/supervisor

[program:postgresql]
command=/usr/lib/postgresql/15/bin/postgres -D /home/user/pgdata -k /home/user/pgsock -h 127.0.0.1 -p 5432
priority=10
autorestart=true
startretries=20
stdout_logfile=/home/user/supervisor/pg.log

[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379 --save "" --appendonly no --dir /home/user
priority=20
autorestart=true
startretries=20
stdout_logfile=/home/user/supervisor/redis.log

[program:elasticsearch]
command=/opt/elasticsearch/bin/elasticsearch -q
priority=30
autorestart=true
startretries=30
startsecs=30
environment=ES_JAVA_OPTS="-Xms512m -Xmx512m",ES_HOME="/opt/elasticsearch"
stdout_logfile=/home/user/supervisor/es.log

[program:dbinit]
command=/app/dbinit.sh
priority=40
autorestart=false
startsecs=0
exitcodes=0
stdout_logfile=/home/user/supervisor/dbinit.log

[program:api]
command=uvicorn app_main:app --host 127.0.0.1 --port 8000
directory=/app
priority=50
autorestart=true
startretries=100
startsecs=5
stdout_logfile=/home/user/supervisor/api.log

[program:nginx]
command=nginx -g "daemon off;"
priority=60
autorestart=true
startretries=20
stdout_logfile=/home/user/supervisor/nginx.log
