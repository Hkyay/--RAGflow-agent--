worker_processes 2;
pid /home/user/nginx.pid;
error_log /home/user/nginx-error.log;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /home/user/nginx-access.log;

    # 非root运行必须把临时目录指到可写位置
    client_body_temp_path /home/user/nginx-cache/client;
    proxy_temp_path       /home/user/nginx-cache/proxy;
    fastcgi_temp_path     /home/user/nginx-cache/fastcgi;
    uwsgi_temp_path       /home/user/nginx-cache/uwsgi;
    scgi_temp_path        /home/user/nginx-cache/scgi;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml+rss;

    server {
        listen 7860;
        server_name localhost;

        root /var/www/html;
        index index.html;

        # 静态资源长缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # API 反代：/api/xxx -> 后端 /xxx（尾斜杠剥离前缀）
        # SSE 流式回答必须关缓冲
        location /api/ {
            proxy_pass http://127.0.0.1:8000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            chunked_transfer_encoding on;
        }

        # React Router 前端路由兜底
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
